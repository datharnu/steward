name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: vectors are current
        run: npm run vectors && git diff --exit-code -- vectors
      - name: forge test (unit, fuzz, invariant, vectors)
        run: forge test
      - run: npm run typecheck
      - run: npm run test:ts
      - name: contracts reach ML-DSA only through the precompiles, no ecrecover
        run: npm run cbom:check
