[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "vectors" }]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "haven-pq-kit/=lib/haven-pq-kit/src/",
  "haven-pq-kit-test/=lib/haven-pq-kit/test/",
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 100
fail_on_revert = false
